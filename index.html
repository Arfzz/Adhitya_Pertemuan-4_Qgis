<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Tetangga Bogor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.8s linear infinite; }
        #map { height: 520px; }
        .leaflet-popup-content-wrapper { border-radius: 3px !important; box-shadow: 0 2px 8px rgba(0,0,0,.12) !important; }
        .leaflet-popup-content { margin: 10px 14px !important; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">

        <div class="mb-4">
            <h1 class="text-lg font-semibold text-gray-800">Peta Tetangga Kecamatan Bogor</h1>
            <p class="text-sm text-gray-400">Data RBI &middot; Supabase PostGIS</p>
        </div>

        <div class="bg-white border border-gray-200">

            <!-- Search -->
            <div class="px-4 py-3 border-b border-gray-200 flex items-center gap-2">
                <label for="wilayahInput" class="text-sm text-gray-500 shrink-0">Kelurahan</label>
                <div class="relative flex-1">
                    <input type="text" id="wilayahInput" list="wilayahList"
                        placeholder="Ketik nama kelurahan..."
                        class="w-full border border-gray-300 rounded-none px-3 py-1.5 text-sm text-gray-800
                               focus:outline-none focus:border-blue-500 focus:ring-0 placeholder-gray-400 pr-7">
                    <button id="btnClear" title="Hapus"
                        class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
                    <datalist id="wilayahList"></datalist>
                </div>
                <button id="btnSearch"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-1.5 rounded-none shrink-0">
                    Tampilkan
                </button>
            </div>

            <!-- Map + overlays -->
            <div class="relative">
                <div id="map" class="w-full z-10"></div>

                <div id="emptyState" class="absolute inset-0 z-20 flex items-center justify-center bg-gray-50">
                    <p class="text-sm text-gray-400">Pilih kelurahan untuk melihat peta</p>
                </div>

                <div id="loadingState" class="hidden absolute inset-0 z-30 flex items-center justify-center bg-white/60">
                    <div class="flex items-center gap-2 text-sm text-gray-500">
                        <svg class="spinner w-4 h-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                        </svg>
                        Memuat...
                    </div>
                </div>
            </div>

            <!-- Status bar -->
            <div id="infoBar" class="hidden px-4 py-2 border-t border-gray-100 flex items-center justify-between">
                <span id="infoText" class="text-xs text-gray-500"></span>
                <div class="flex items-center gap-3 text-xs text-gray-400">
                    <span class="flex items-center gap-1.5">
                        <span class="inline-block w-3 h-3" style="background:#fecaca;border:1.5px solid #ef4444"></span>Pusat
                    </span>
                    <span class="flex items-center gap-1.5">
                        <span class="inline-block w-3 h-3" style="background:#bfdbfe;border:1.5px solid #3b82f6"></span>Tetangga
                    </span>
                </div>
            </div>

            <!-- Error bar -->
            <div id="errorBar" class="hidden px-4 py-2 border-t border-red-100 bg-red-50">
                <span id="errorText" class="text-xs text-red-600"></span>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const supabaseUrl = 'https://dnmukalylvawkzbsfgrv.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubXVrYWx5bHZhd2t6YnNmZ3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMTE1NDIsImV4cCI6MjEwNDg4NzU0Mn0.4wmdxWK5rgvxH70XTkY0NoKrjACUFaEQcdctwWfV43Y';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const map = L.map('map').setView([-6.56, 106.86], 12);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    }).addTo(map);
    let currentLayer = null;

    const inputElement = document.getElementById('wilayahInput');
    const btnSearch    = document.getElementById('btnSearch');
    const btnClear     = document.getElementById('btnClear');
    const emptyState   = document.getElementById('emptyState');
    const loadingState = document.getElementById('loadingState');
    const infoBar      = document.getElementById('infoBar');
    const infoText     = document.getElementById('infoText');
    const errorBar     = document.getElementById('errorBar');
    const errorText    = document.getElementById('errorText');

    function showError(msg) {
        errorText.textContent = msg;
        errorBar.classList.remove('hidden');
        infoBar.classList.add('hidden');
    }
    function hideError() { errorBar.classList.add('hidden'); }

    function showLoading() { loadingState.classList.remove('hidden'); btnSearch.disabled = true; }
    function hideLoading() { loadingState.classList.add('hidden'); btnSearch.disabled = false; }
    function showEmptyState() { emptyState.classList.remove('hidden'); infoBar.classList.add('hidden'); hideError(); }
    function hideEmptyState() { emptyState.classList.add('hidden'); }

    let namaTargetGlobal = '';

    function getNama(props) {
        return props.name_4 || props.NAME_4 || props.Name_4 || '';
    }

    function isPusatFn(props) {
        if (typeof props.is_pusat !== 'undefined') return !!props.is_pusat;
        if (typeof props.is_center !== 'undefined') return !!props.is_center;
        return getNama(props).toLowerCase().trim() === namaTargetGlobal;
    }

    async function loadMap(targetWilayah) {
        namaTargetGlobal = targetWilayah.toLowerCase().trim();
        showLoading();
        hideEmptyState();
        hideError();

        const { data, error } = await supabaseClient.rpc('get_tetangga_dinamis', {
            target_name: targetWilayah
        });

        hideLoading();

        if (error) {
            console.error(error);
            showError('Gagal memuat data dari server.');
            showEmptyState();
            return;
        }

        if (!data || !data.features || data.features.length === 0) {
            showError('Wilayah "' + targetWilayah + '" tidak ditemukan.');
            showEmptyState();
            return;
        }

        if (currentLayer) map.removeLayer(currentLayer);

        let jumlahTetangga = 0;

        currentLayer = L.geoJSON(data, {
            style: function(feature) {
                const isPusat = isPusatFn(feature.properties);
                if (!isPusat) jumlahTetangga++;
                return {
                    color:       isPusat ? '#ef4444' : '#3b82f6',
                    weight:      isPusat ? 2.5 : 1.5,
                    fillColor:   isPusat ? '#fecaca' : '#bfdbfe',
                    fillOpacity: 0.5,
                };
            },
            onEachFeature: function(feature, layer) {
                const props   = feature.properties;
                const nama    = getNama(props) || 'Tanpa Nama';
                const luas    = props.luas_hektar;
                const isPusat = isPusatFn(props);

                layer.bindPopup(
                    '<strong>' + nama + '</strong>' +
                    (isPusat ? ' <span style="color:#ef4444;font-size:11px">(Pusat)</span>' : '') +
                    '<br><span style="color:#6b7280;font-size:12px">Luas: ' +
                    (luas ? luas.toFixed(2) + ' Ha' : '—') + '</span>'
                );

                layer.on('mouseover', function() { this.setStyle({ fillOpacity: 0.75 }); });
                layer.on('mouseout',  function() { currentLayer.resetStyle(this); });
            }
        }).addTo(map);

        map.fitBounds(currentLayer.getBounds(), { padding: [16, 16] });

        infoText.textContent = targetWilayah + ' \u00b7 ' + jumlahTetangga + ' kelurahan berbatasan';
        infoBar.classList.remove('hidden');
    }

    btnSearch.addEventListener('click', function() {
        const w = inputElement.value.trim();
        if (w) loadMap(w);
        else { showError('Ketik nama kelurahan terlebih dahulu.'); inputElement.focus(); }
    });

    inputElement.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { const w = this.value.trim(); if (w) loadMap(w); }
    });

    inputElement.addEventListener('input', function() {
        btnClear.classList.toggle('hidden', this.value.length === 0);
    });

    btnClear.addEventListener('click', function() {
        inputElement.value = ''; btnClear.classList.add('hidden'); inputElement.focus();
    });

    async function populateDatalist() {
        const dataList = document.getElementById('wilayahList');
        const { data, error } = await supabaseClient
            .from('rbi_jaringan_jalan')
            .select('"NAME_4"')
            .order('"NAME_4"', { ascending: true });
        if (error) { console.error(error); return; }
        const names = [...new Set(data.map(d => d.NAME_4).filter(Boolean))];
        names.forEach(function(nama) {
            const opt = document.createElement('option');
            opt.value = nama;
            dataList.appendChild(opt);
        });
    }

    populateDatalist();
    showEmptyState();
    </script>
</body>
</html>
