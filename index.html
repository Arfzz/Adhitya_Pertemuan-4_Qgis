<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Tetangga Bogor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body class="bg-slate-100 flex flex-col items-center p-6 min-h-screen">

    <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg p-5">
        <h1 class="text-2xl font-bold mb-2 text-slate-800">Wilayah yang Berbatasan dengan kecamatan di Bogor</h1>
        <p class="text-slate-600 mb-4">Data RBI dari Supabase</p>
        <!-- Dropdown Pemilihan Wilayah -->
       <!-- Fitur Pencarian Wilayah -->
        <div class="mb-4 w-full md:w-1/2 flex gap-2">
            <div class="flex-grow">
                <label for="wilayahInput" class="block text-sm font-medium text-slate-700 mb-1">Cari Wilayah Pusat:</label>
                <!-- Input text dengan fitur autocomplete dari datalist -->
                <input type="text" id="wilayahInput" list="wilayahList" placeholder="Ketik nama kelurahan..." 
                    class="w-full border border-slate-300 rounded-md shadow-sm p-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <datalist id="wilayahList"></datalist>
            </div>
            <div class="flex items-end">
                <button id="btnSearch" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-200">
                    Cari
                </button>
            </div>
        </div>

        <!-- Tempat Peta Ditampilkan -->
        <div id="map" class="w-full h-[500px] rounded-lg border-2 border-slate-200 z-10"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    // 1. Kredensial Supabase
    const supabaseUrl = 'https://dnmukalylvawkzbsfgrv.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubXVrYWx5bHZhd2t6YnNmZ3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMTE1NDIsImV4cCI6MjEwNDg4NzU0Mn0.4wmdxWK5rgvxH70XTkY0NoKrjACUFaEQcdctwWfV43Y';

    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // 2. Inisialisasi Peta
    const map = L.map('map').setView([-6.56, 106.86], 12);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    let currentLayer = null;

    // 3. Fungsi Load Map
    async function loadMap(targetWilayah) {
        const { data, error } = await supabaseClient.rpc('get_tetangga_dinamis', {
            target_name: targetWilayah
        });

        if (error) {
            console.error("Error dari Supabase:", error);
            return;
        }

        if (!data || data.features.length === 0) {
            alert(`Tetangga untuk wilayah ${targetWilayah} tidak ditemukan.`);
            return;
        }

        if (currentLayer) {
            map.removeLayer(currentLayer);
        }

        currentLayer = L.geoJSON(data, {
            style: {
                color: '#3b82f6',
                weight: 2,
                fillColor: '#93c5fd',
                fillOpacity: 0.5
            },
            onEachFeature: function (feature, layer) {
                if (feature.properties) {
                    const nama = feature.properties.name_4 || "Tanpa Nama";
                    const luas = feature.properties.luas_hektar; 

                    let textLuas = "Data tidak tersedia";
                    if (luas) {
                        textLuas = luas.toFixed(2) + " Hektar";
                    }

                    layer.bindPopup(`
                        <div class="p-1">
                            <div class="font-bold text-lg text-slate-800 border-b pb-1 mb-2">
                                ${nama}
                            </div>
                            <div class="text-sm text-slate-600 space-y-1">
                                <p><b>Luas:</b> ${textLuas}</p>
                            </div>
                        </div>
                    `);
                }
            }
        }).addTo(map);

        map.fitBounds(currentLayer.getBounds());
    }

    // 4. Setup Dropdown
   const inputElement = document.getElementById('wilayahInput');
    const btnSearch = document.getElementById('btnSearch');

    // Menjalankan fungsi loadMap saat tombol Cari diklik
    btnSearch.addEventListener('click', function () {
        const wilayahBaru = inputElement.value.trim();
        if (wilayahBaru) {
            loadMap(wilayahBaru);
        } else {
            alert("Silakan ketik nama wilayah terlebih dahulu!");
        }
    });

    // Opsional: Bisa langsung mencari saat menekan tombol 'Enter' di keyboard
    inputElement.addEventListener('keypress', function (event) {
        if (event.key === 'Enter') {
            const wilayahBaru = inputElement.value.trim();
            if (wilayahBaru) loadMap(wilayahBaru);
        }
    });

    // 5. Fungsi Mengisi Autocomplete (Datalist)
    async function populateDatalist() {
        const dataList = document.getElementById('wilayahList');
        
        const { data, error } = await supabaseClient
            .from('rbi_jaringan_jalan')
            .select('"NAME_4"')
            .order('"NAME_4"', { ascending: true });

        if (error) {
            console.error("Gagal memuat daftar wilayah:", error);
            return;
        }

        // Memasukkan nama unik ke dalam datalist sebagai saran pencarian
        const uniqueNames = [...new Set(data.map(item => item.NAME_4))];

        uniqueNames.forEach(nama => {
            if (nama) {
                const option = document.createElement('option');
                option.value = nama;
                dataList.appendChild(option);
            }
        });

        // Atur nilai awal input dan panggil peta pertama kali
        inputElement.value = 'Baranangsiang';
        loadMap('Baranangsiang');
    }

    // Eksekusi fungsi pertama kali
    populateDatalist();

    // Eksekusi fungsi pertama kali
    populateDropdown();
</script>
</body>

</html>
